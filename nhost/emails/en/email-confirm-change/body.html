<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Confirm email change</title>
</head>
<body style="margin:0;padding:0;background:#f6f6f6;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f6f6f6;padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" style="max-width:480px;background:#ffffff;border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.08);">
          <tr>
            <td style="padding:0;line-height:0;font-size:0;">
              <img src="https://www.tastyplates.co/images/email-header.png" alt="TastyPlates" width="480" style="display:block;width:100%;max-width:480px;height:auto;border:0;" />
            </td>
          </tr>
          <tr>
            <td style="padding:32px 28px;">
              <h1 style="margin:0 0 16px;font-size:22px;line-height:1.3;color:#111827;">Confirm your new email</h1>
              <p style="margin:0 0 20px;font-size:15px;line-height:1.6;color:#4b5563;">
                Hi ${displayName}, confirm this change to start using your new email address for <strong>${email}</strong>.
              </p>
              <p style="margin:0 0 24px;">
                <a href="${link}" style="display:inline-block;background:#ff7c0a;color:#ffffff;text-decoration:none;font-weight:600;font-size:15px;padding:12px 24px;border-radius:999px;">Confirm new email</a>
              </p>
              <p style="margin:0;font-size:13px;line-height:1.5;color:#9ca3af;">
                After you confirm, you may be redirected to: <span style="word-break:break-all;color:#6b7280;">${redirectTo}</span><br /><br />
                <span style="word-break:break-all;color:#6b7280;">${link}</span>
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
