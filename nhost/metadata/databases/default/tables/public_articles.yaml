table:
  name: articles
  schema: public

select_permissions:
  - role: public
    permission:
      columns: "*"
      filter:
        _and:
          - status: { _eq: "published" }
          - deleted_at: { _is_null: true }
      allow_aggregations: true

  - role: admin
    permission:
      columns: "*"
      filter: {}
      allow_aggregations: true
