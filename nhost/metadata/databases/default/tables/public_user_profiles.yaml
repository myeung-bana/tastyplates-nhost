table:
  name: user_profiles
  schema: public

object_relationships:
  - name: user
    using:
      foreign_key_constraint_on: user_id

select_permissions:
  - role: public
    permission:
      columns:
        - user_id
        - username
        - about_me
        - palates
        - onboarding_complete
        - created_at
      filter:
        deleted_at:
          _is_null: true
      allow_aggregations: true

  - role: user
    permission:
      columns:
        - user_id
        - username
        - about_me
        - birthdate
        - gender
        - pronoun
        - palates
        - onboarding_complete
        - created_at
        - updated_at
        - deleted_at
      filter:
        deleted_at:
          _is_null: true
      allow_aggregations: true

  - role: admin
    permission:
      columns: "*"
      filter: {}
      allow_aggregations: true

insert_permissions:
  - role: admin
    permission:
      columns: "*"
      check: {}

update_permissions:
  - role: admin
    permission:
      columns: "*"
      filter: {}

delete_permissions:
  - role: admin
    permission:
      filter: {}
