table:
  name: users
  schema: auth

select_permissions:
  - role: user
    permission:
      columns:
        - id
        - email
        - displayName
        - avatarUrl
        - locale
        - createdAt
      filter:
        id:
          _eq: X-Hasura-User-Id

  - role: admin
    permission:
      columns: "*"
      filter: {}
      allow_aggregations: true

update_permissions:
  - role: user
    permission:
      columns:
        - displayName
        - avatarUrl
        - locale
      filter:
        id:
          _eq: X-Hasura-User-Id

  - role: admin
    permission:
      columns: "*"
      filter: {}
